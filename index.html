<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular-Ansicht</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden; /* Verhindert horizontales Scrollen auf der Hauptseite */
      background-color: #fff;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    iframe {
      border: none;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <div class="iframe-wrapper">
    <iframe id="grist-iframe" style="display: none;"></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const zoomLevel = parseFloat(urlParams.get('zoom')) || 1.3; // Standard: 130%

    // Optional: ?form=<ID>/<Nummer> überschreibt das Standardformular
    const formPath = urlParams.get('form') || 'b7Q6CRTt3cJjF5F51bTCTm/44';
    const gristBaseUrl = `https://db.intranet.fgz-risc.de/forms/${formPath}`;

    const iframe = document.getElementById('grist-iframe');
    iframe.src = gristBaseUrl;

    // Iframe um den Zoomfaktor schmaler machen und dann hochskalieren,
    // sodass es wieder genau die Bildschirmbreite füllt.
    iframe.style.width = (100 / zoomLevel) + '%';
    iframe.style.height = (100 / zoomLevel) + 'vh';
    iframe.style.transform = `scale(${zoomLevel})`;
    iframe.style.display = 'block';
  </script>
</body>
</html>
