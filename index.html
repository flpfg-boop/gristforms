<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular-Ansicht</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow-x: hidden; /* Verhindert horizontales Scrollen auf der Hauptseite */
      background-color: #fff;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100vh;
      overflow: hidden; /* schneidet den verschobenen Bereich (Grist-Balken) ab */
      position: relative;
    }

    iframe {
      border: none;
      outline: none;
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <div class="iframe-wrapper">
    <iframe id="grist-iframe" style="display: none;"></iframe>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    // Zoom: ?zoom=1.5  (Standard: 130 %)
    const zoomLevel = parseFloat(urlParams.get('zoom')) || 1.3;

    // Oben abzuschneidende Höhe (blauer "Grist Form"-Balken) in iframe-Pixeln.
    // ?crop=28  (Standard: 28, bei Bedarf anpassen; 0 = nichts abschneiden)
    const cropParam = parseFloat(urlParams.get('crop'));
    const cropTop = isNaN(cropParam) ? 28 : cropParam;

    // Optional: ?form=<ID>/<Nummer> überschreibt das Standardformular
    const formPath = urlParams.get('form') || 'b7Q6CRTt3cJjF5F51bTCTm/44';
    const gristBaseUrl = `https://db.intranet.fgz-risc.de/forms/${formPath}`;

    const iframe = document.getElementById('grist-iframe');
    iframe.src = gristBaseUrl;

    // Iframe um den Zoomfaktor schmaler machen und dann hochskalieren,
    // sodass es wieder genau die Bildschirmbreite füllt.
    iframe.style.width = (100 / zoomLevel) + '%';

    // Höhe: Viewport (im iframe-Raum) plus der abgeschnittene Bereich oben.
    iframe.style.height = `calc(${100 / zoomLevel}vh + ${cropTop}px)`;

    // Reihenfolge wichtig: Es wird zuerst im iframe-Raum nach oben verschoben
    // (translate) und danach skaliert (scale). Dadurch ist der Zuschnitt
    // unabhängig vom Gerät und vom Zoomfaktor.
    iframe.style.transform = `scale(${zoomLevel}) translate(0, -${cropTop}px)`;

    iframe.style.display = 'block';
  </script>
</body>
</html>
